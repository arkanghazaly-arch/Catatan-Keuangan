<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keuangan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f1f5fb;--surface:#fff;--ink:#142238;--muted:#5f6f86;--line:#d8e1ee;--accent:#1e5bc6;--accent-ink:#fff;--danger:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1724;--surface:#182233;--ink:#e6edf8;--muted:#8fa0b8;--line:#2a3750;--accent:#6aa5ff;--accent-ink:#0b1424;--danger:#f08a78}}
:root[data-theme="dark"]{--bg:#0f1724;--surface:#182233;--ink:#e6edf8;--muted:#8fa0b8;--line:#2a3750;--accent:#6aa5ff;--accent-ink:#0b1424;--danger:#f08a78}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,.total{font-family:'Bricolage Grotesque',Figtree,sans-serif}
h1{font-size:1.1rem;margin:0 0 4px;font-weight:500;color:var(--muted)}
.total{font-size:2.6rem;font-weight:700;margin:0;letter-spacing:-.02em}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 20px}
.split div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.split small{display:block;color:var(--muted);font-size:.82rem}
.split b{font-size:1.05rem}
.in{color:var(--accent)}.out{color:var(--danger)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{font-size:.95rem;margin:0 0 10px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:12px}
.seg button{padding:9px;background:none;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.full{grid-column:1/-1}
button{font:inherit;cursor:pointer;border-radius:10px;border:0}
.primary{width:100%;padding:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;margin-top:12px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:.88rem}
.track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--danger);border-radius:5px}
.filters{display:flex;gap:8px;margin-bottom:10px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.info{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:.82rem;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
.del{background:none;color:var(--muted);padding:6px 8px;font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.tools{display:flex;gap:8px;justify-content:flex-end}
.tools button{background:none;color:var(--muted);font-size:.85rem;text-decoration:underline;padding:4px}
</style>
</head>
<body>
<main>
  <h1>Saldo bulan ini</h1>
  <p class="total" id="saldo">Rp0</p>
  <div class="split">
    <div><small>Pemasukan</small><b class="in" id="tin">Rp0</b></div>
    <div><small>Pengeluaran</small><b class="out" id="tout">Rp0</b></div>
  </div>

  <section class="panel" aria-label="Tambah catatan">
    <div class="seg" role="group" aria-label="Jenis catatan">
      <button id="t-out" aria-pressed="true">Pengeluaran</button>
      <button id="t-in" aria-pressed="false">Pemasukan</button>
    </div>
    <div class="row">
      <div class="full"><label for="name">Keterangan</label><input id="name" placeholder="Contoh: makan siang" autocomplete="off"></div>
      <div><label for="amount">Jumlah (Rp)</label><input id="amount" type="number" inputmode="numeric" min="0" placeholder="25000"></div>
      <div><label for="cat">Kategori</label><select id="cat"></select><input id="newcat" placeholder="Tulis nama kategori" autocomplete="off" maxlength="30" hidden style="margin-top:6px"></div>
      <div class="full"><label for="date">Tanggal</label><input id="date" type="date"></div>
    </div>
    <button class="primary" id="add">Simpan pengeluaran</button>
  </section>

  <section class="panel" aria-label="Ringkasan pengeluaran">
    <h2>Pengeluaran per kategori</h2>
    <div class="bars" id="bars"></div>
  </section>

  <section class="panel" aria-label="Daftar catatan">
    <div class="filters">
      <select id="fmonth" aria-label="Filter bulan"></select>
      <select id="ftype" aria-label="Filter jenis"><option value="">Semua catatan</option><option value="in">Pemasukan</option><option value="out">Pengeluaran</option></select>
    </div>
    <ul id="list"></ul>
    <div class="tools"><button id="csv">Unduh CSV</button><button id="clear">Hapus semua</button></div>
  </section>
</main>
<script>
const KEY='pengeluaran-v1';
let items=[];
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
items.forEach(i=>{if(!i.type)i.type='out'});
const $=id=>document.getElementById(id);
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const CATS={out:['Makanan','Transportasi','Belanja','Tagihan','Hiburan','Lainnya'],in:['Gaji','Bonus','Usaha','Hadiah','Lainnya']};
let type='out';
$('date').value=today();
const bulan=ym=>{const [y,m]=ym.split('-');return new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})};

const NEW='__new__';
function fillCats(sel){
  const s=$('cat');
  const custom=[...new Set(items.filter(i=>i.type===type).map(i=>i.cat))].filter(c=>!CATS[type].includes(c));
  s.innerHTML='';
  [...CATS[type],...custom].forEach(c=>{const o=document.createElement('option');o.value=o.textContent=c;s.appendChild(o)});
  const o=document.createElement('option');o.value=NEW;o.textContent='+ Kategori baru…';s.appendChild(o);
  if(sel)s.value=sel;
  $('newcat').hidden=true;
}
function setType(t){
  type=t;
  $('t-out').setAttribute('aria-pressed',t==='out');
  $('t-in').setAttribute('aria-pressed',t==='in');
  fillCats();
  $('name').placeholder=t==='out'?'Contoh: makan siang':'Contoh: gaji bulanan';
  $('add').textContent=t==='out'?'Simpan pengeluaran':'Simpan pemasukan';
}
function render(){
  const months=[...new Set([today().slice(0,7),...items.map(i=>i.date.slice(0,7))])].sort().reverse();
  const cur=$('fmonth').value||months[0];
  $('fmonth').innerHTML=months.map(m=>`<option value="${m}" ${m===cur?'selected':''}>${bulan(m)}</option>`).join('');
  const inMonth=items.filter(i=>i.date.startsWith($('fmonth').value));
  const sum=t=>inMonth.filter(i=>i.type===t).reduce((s,i)=>s+i.amount,0);
  const tin=sum('in'),tout=sum('out');
  $('saldo').textContent=rp(tin-tout);
  $('tin').textContent=rp(tin);$('tout').textContent=rp(tout);
  const by={};inMonth.filter(i=>i.type==='out').forEach(i=>by[i.cat]=(by[i.cat]||0)+i.amount);
  const entries=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $('bars').innerHTML=entries.length?entries.map(([c,v])=>`<div class="bar"><span>${c}</span><div class="track"><div class="fill" style="width:${v/tout*100}%"></div></div><span>${rp(v)}</span></div>`).join(''):'<div class="empty">Ringkasan muncul setelah Anda mencatat pengeluaran.</div>';
  const ft=$('ftype').value;
  const shown=inMonth.filter(i=>!ft||i.type===ft).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $('list').innerHTML=shown.length?shown.map(i=>`<li><div class="info"><div class="name"></div><div class="meta">${i.type==='in'?'Pemasukan':'Pengeluaran'} · ${i.cat} · ${new Date(i.date).toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</div></div><span class="amt ${i.type}">${i.type==='in'?'+':'-'}${rp(i.amount)}</span><button class="del" data-id="${i.id}" aria-label="Hapus">Hapus</button></li>`).join(''):'<li class="empty" style="display:block">Tidak ada catatan untuk ditampilkan.</li>';
  [...$('list').querySelectorAll('.name')].forEach((el,k)=>el.textContent=shown[k].name);
}
$('t-out').onclick=()=>setType('out');
$('t-in').onclick=()=>setType('in');
$('cat').onchange=()=>{$('newcat').hidden=$('cat').value!==NEW;if(!$('newcat').hidden)$('newcat').focus()};
$('add').onclick=()=>{
  const name=$('name').value.trim(),amount=parseFloat($('amount').value),date=$('date').value||today();
  if(!name||!(amount>0)){alert('Isi keterangan dan jumlah yang lebih dari 0.');return}
  let cat=$('cat').value;
  if(cat===NEW){cat=$('newcat').value.trim();if(!cat){alert('Tulis nama kategori baru.');$('newcat').focus();return}}
  items.push({id:Date.now(),type,name,amount,cat,date});
  save();$('name').value='';$('amount').value='';$('newcat').value='';fillCats(cat);$('name').focus();
  $('fmonth').value=date.slice(0,7);render();
};
$('list').onclick=e=>{const id=e.target.dataset.id;if(id){items=items.filter(i=>i.id!=id);save();render()}};
$('fmonth').onchange=render;$('ftype').onchange=render;
$('clear').onclick=()=>{if(items.length&&confirm('Hapus semua catatan? Tindakan ini tidak bisa dibatalkan.')){items=[];save();render()}};
$('csv').onclick=()=>{
  const rows=['Tanggal,Jenis,Keterangan,Kategori,Jumlah',...items.map(i=>[i.date,i.type==='in'?'Pemasukan':'Pengeluaran','"'+i.name.replace(/"/g,'""')+'"',i.cat,i.amount].join(','))];
  const w=window.open('','_blank');
  if(w){w.document.write('<pre></pre>');w.document.querySelector('pre').textContent=rows.join('\n')}
  else alert('Pop-up diblokir. Izinkan pop-up untuk melihat data CSV.');
};
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});
setType('out');render();
</script>
</body>
</html>
